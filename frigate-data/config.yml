mqtt:
  enabled: false

tls:
  enabled: false

go2rtc:
  streams:
    logitech_c922: rtsp://webcam-rtsp:8554/webcam

cameras:
  logitech_c922:
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/logitech_c922
          input_args: preset-rtsp-restream
          roles:
            - detect
    detect:
      enabled: true
      width: 1280
      height: 720
      fps: 5
    objects:
      track:
        - person
    record:
      enabled: false
    snapshots:
      enabled: true
      retain:
        default: 3
version: 0.18-0
